# Publica a versão de demonstração (catálogo fictício, somente leitura).
# A loja real é publicada na Cloudflare com "npm run deploy".
[build]
  command = "npm run build:demo"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/api/products"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
